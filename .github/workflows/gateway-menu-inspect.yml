name: Inspect Gateway reporting menu
on:
  workflow_dispatch:
    inputs:
      report:
        description: Optional exact report name to open
        type: string
        required: false
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt'
      - run: python -m playwright install --with-deps chromium
      - name: List reports without changing business data
        env:
          REPORT: ${{ inputs.report }}
          CO_GATEWAY_USER: ${{ secrets.CO_GATEWAY_USER }}
          CO_GATEWAY_PASS: ${{ secrets.CO_GATEWAY_PASS }}
        run: python 'tips & payroll/gateway_menu_inspect.py' --report "$REPORT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-menu-${{ github.run_id }}
          path: tips & payroll/reports/gateway-menu/
          retention-days: 2
          if-no-files-found: ignore
