name: DoorDash outcomes and email
on:
  schedule:
    - cron: '0 15,16 * * 2'
  workflow_dispatch:
    inputs:
      source:
        description: Live portal check or private saved-export preview (cannot email)
        type: choice
        default: portal
        options: [portal, saved-export-preview]
      send_email:
        description: Send tracker only after a complete live outcome check
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: doordash-cloud
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DOORDASH_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: doordash
    env:
      DOORDASH_BROWSER_MODE: cloud
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set temporary history directory
        run: echo "DOORDASH_DATA_DIR=$RUNNER_TEMP/doordash-data" >> "$GITHUB_ENV"
      - name: Check payroll-aligned report date
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python biweekly_summary.py --schedule-gate)" >> "$GITHUB_OUTPUT"
          fi
      - name: Check cloud merchant connection
        if: steps.gate.outputs.run == 'true' && inputs.source != 'saved-export-preview'
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: |
          if [ -z "$DOORDASH_STORAGE_STATE" ]; then
            echo '::error::Add DOORDASH_STORAGE_STATE after connecting the DoorDash merchant account. No local browser will be opened.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          npm ci --prefix scraper --no-audit --no-fund
          python -m pip install requests==2.32.5 tzdata==2025.3
      - name: Install merchant browser
        if: steps.gate.outputs.run == 'true' && inputs.source != 'saved-export-preview'
        run: cd scraper && npx playwright install --with-deps chromium
      - name: Restore persistent history
        if: steps.gate.outputs.run == 'true'
        id: history
        run: python cloud_state.py restore
      - name: Scan merchant stores without submitting disputes
        if: steps.gate.outputs.run == 'true' && inputs.source != 'saved-export-preview'
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: xvfb-run -a node scraper/run.mjs --mode scan
      - name: Refresh saved order outcomes
        if: steps.gate.outputs.run == 'true' && inputs.source != 'saved-export-preview'
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: xvfb-run -a node scraper/run.mjs --mode outcomes
      - name: Validate saved export preview
        if: steps.gate.outputs.run == 'true' && inputs.source == 'saved-export-preview'
        env:
          SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from financial_export import validate_reconciliation
          if os.environ['SEND_EMAIL'] == 'true':
              raise ValueError('Saved export preview cannot send an earnings email')
          data = Path(os.environ['DOORDASH_DATA_DIR'])
          value = validate_reconciliation(json.loads((data/'financial-reconciliation.json').read_text()),
              json.loads((data/'ledger.json').read_text()))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Saved export preview: {value['matched_orders']} of {value['tracked_orders']} tracked orders matched. No live portal refresh and no email.\n")
          PY
      - name: Build tracker
        if: steps.gate.outputs.run == 'true'
        id: tracker
        run: |
          python biweekly_summary.py
          node scraper/report.mjs
          python -c "from pathlib import Path; import os; p=max(Path('reports').glob('DoorDash-Tracker-*.xlsx'), key=lambda p:p.stat().st_mtime); open(os.environ['GITHUB_OUTPUT'],'a').write('path='+str(p.resolve())+'\n')"
      - name: Email tracker
        if: steps.gate.outputs.run == 'true' && inputs.source != 'saved-export-preview' && (inputs.send_email || github.event_name == 'schedule')
        env:
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          REPORT_FILE: ${{ steps.tracker.outputs.path }}
        run: python email_report.py "$REPORT_FILE" --summary reports/biweekly-summary.json
      - name: Persist outcomes and uncertain delivery receipts
        if: always() && steps.history.outcome == 'success' && inputs.source != 'saved-export-preview'
        run: python cloud_state.py persist
      - name: Keep private diagnostic reports briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doordash-${{ github.run_id }}
          path: |
            doordash/reports/
            ${{ runner.temp }}/doordash-data/review-plan.json
          retention-days: 3
          if-no-files-found: ignore
