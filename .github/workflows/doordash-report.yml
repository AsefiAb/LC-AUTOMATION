name: DoorDash outcomes and email
on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send tracker only after a complete live outcome check
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: doordash-cloud
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: doordash
    env:
      DOORDASH_BROWSER_MODE: cloud
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set temporary history directory
        run: echo "DOORDASH_DATA_DIR=$RUNNER_TEMP/doordash-data" >> "$GITHUB_ENV"
      - name: Check cloud merchant connection
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: |
          if [ -z "$DOORDASH_STORAGE_STATE" ]; then
            echo '::error::Add DOORDASH_STORAGE_STATE after connecting the DoorDash merchant account. No local browser will be opened.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci --prefix scraper --no-audit --no-fund
          python -m pip install requests==2.32.5 tzdata==2025.3
          cd scraper
          npx playwright install --with-deps chromium
      - name: Restore persistent history
        id: history
        run: python cloud_state.py restore
      - name: Scan merchant stores without submitting disputes
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: node scraper/run.mjs --mode scan
      - name: Refresh saved order outcomes
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: node scraper/run.mjs --mode outcomes
      - name: Build tracker
        id: tracker
        run: |
          node scraper/report.mjs
          python -c "from pathlib import Path; import os; p=max(Path('reports').glob('DoorDash-Tracker-*.xlsx'), key=lambda p:p.stat().st_mtime); open(os.environ['GITHUB_OUTPUT'],'a').write('path='+str(p.resolve())+'\n')"
      - name: Email tracker
        if: inputs.send_email
        env:
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          REPORT_FILE: ${{ steps.tracker.outputs.path }}
        run: python email_report.py "$REPORT_FILE"
      - name: Persist outcomes and uncertain delivery receipts
        if: always() && steps.history.outcome == 'success'
        run: python cloud_state.py persist
      - name: Keep private diagnostic reports briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doordash-${{ github.run_id }}
          path: |
            doordash/reports/
            ${{ runner.temp }}/doordash-data/review-plan.json
          retention-days: 3
          if-no-files-found: ignore
