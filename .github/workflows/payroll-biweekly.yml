name: Biweekly payroll reports
on:
  schedule:
    # Start at 08:00 Pacific, including DST. Python gates alternate Tuesdays
    # from September 22, 2026; delivery receipts suppress duplicate mail.
    - cron: '0 8 * * 2'
      timezone: America/Los_Angeles
    # Off-the-hour retries if GitHub delays/drops a trigger or a source fails.
    - cron: '20 8,9,11 * * 2'
      timezone: America/Los_Angeles
    # Independent UTC catch-up triggers. The Pacific gate rejects pre-08:00
    # and off-week runs; review and payroll receipts prevent duplicate emails.
    - cron: '7,37 15,16,17,18 * * 2'
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive start (YYYY-MM-DD); blank uses latest completed scheduled period
        type: string
      end_date:
        description: Inclusive end (YYYY-MM-DD)
        type: string
      mode:
        description: Read-only preflight, private workbook preview, or email Alicia
        type: choice
        default: preflight
        options: [preflight, preview, deliver]
      review_revision:
        description: Optional explicit review correction slug (e.g. tcp-hours-v2); blank keeps existing receipts
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: biweekly-payroll
  cancel-in-progress: false
jobs:
  payroll:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt'
      - name: Check Pacific payroll schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python 'tips & payroll/payroll_run.py' --schedule-gate)" >> "$GITHUB_OUTPUT"
          fi
      - run: python -m playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'
      - run: python -m unittest discover -s 'tips & payroll' -p 'test_*.py' -q
        if: steps.gate.outputs.run == 'true'
      - name: Read, reconcile, and prepare payroll
        if: steps.gate.outputs.run == 'true'
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MODE: ${{ inputs.mode || (vars.PAYROLL_AUTOMATION_ENABLED == 'true' && 'deliver' || 'preflight') }}
          REVIEW_REVISION: ${{ inputs.review_revision }}
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          CO_GATEWAY_USER: ${{ secrets.CO_GATEWAY_USER }}
          CO_GATEWAY_PASS: ${{ secrets.CO_GATEWAY_PASS }}
          AZ_GATEWAY_USER: ${{ secrets.AZ_GATEWAY_USER }}
          AZ_GATEWAY_PASS: ${{ secrets.AZ_GATEWAY_PASS }}
          TX_GATEWAY_USER: ${{ secrets.TX_GATEWAY_USER }}
          TX_GATEWAY_PASS: ${{ secrets.TX_GATEWAY_PASS }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          ADP_CO_TEMPLATE: ${{ secrets.ADP_CO_TEMPLATE }}
          ADP_AZ_TEMPLATE: ${{ secrets.ADP_AZ_TEMPLATE }}
          ADP_TX_TEMPLATE: ${{ secrets.ADP_TX_TEMPLATE }}
          ADP_ROSTER_SETTINGS: ${{ secrets.ADP_ROSTER_SETTINGS }}
          ADP_CLIENT_ID: ${{ secrets.ADP_CLIENT_ID }}
          ADP_CLIENT_SECRET: ${{ secrets.ADP_CLIENT_SECRET }}
          ADP_CERTIFICATE: ${{ secrets.ADP_CERTIFICATE }}
          ADP_PRIVATE_KEY: ${{ secrets.ADP_PRIVATE_KEY }}
          PAYROLL_ROLE_REVIEWS: ${{ secrets.PAYROLL_ROLE_REVIEWS }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$MODE" = 'preflight' ]; then
            echo 'Payroll validation only: delivery is disabled or preflight was selected. No email or ADP submission.' >> "$GITHUB_STEP_SUMMARY"
          fi
          args=(--mode "$MODE")
          if [ -n "$START_DATE" ]; then args+=(--start "$START_DATE"); fi
          if [ -n "$END_DATE" ]; then args+=(--end "$END_DATE"); fi
          if [ -n "$REVIEW_REVISION" ]; then args+=(--review-revision "$REVIEW_REVISION"); fi
          python 'tips & payroll/payroll_run.py' "${args[@]}"
      - name: Explain an incomplete payroll run
        if: failure() && steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          echo 'Payroll reconciliation did not complete. Regional reports and incomplete EPI CSV candidates may have been emailed; check delivery receipts before retrying. CSVs preserve the supplied ADP template and known matched amounts; unknown amounts stay blank. Inspect private readiness, review-delivery-results, source-reconciliation, and regional issues reports. Email delivery is not payroll approval.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If TCP returned closed shifts with zero calculated hours, reconcile a matching Complete Payroll OpenXML export using the payroll runbook. Never replace missing hours with zero or estimate overtime.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep private payroll reports briefly
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payroll-${{ github.run_id }}
          # Includes period/gateway-diagnostics even when report generation fails.
          path: tips & payroll/reports/
          retention-days: 3
          if-no-files-found: ignore
