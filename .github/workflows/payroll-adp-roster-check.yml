name: Check ADP roster against payroll
on:
  workflow_dispatch:
    inputs:
      payroll_run_id:
        description: Payroll run whose private artifact holds payroll-input.json (blank compares ADP with the EPI templates only)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt'
      - name: Download payroll employee list
        if: inputs.payroll_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.payroll_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/payroll
      - name: Read every ADP worker and compare (read-only, no email)
        env:
          ADP_CLIENT_ID: ${{ secrets.ADP_CLIENT_ID }}
          ADP_CLIENT_SECRET: ${{ secrets.ADP_CLIENT_SECRET }}
          ADP_CERTIFICATE: ${{ secrets.ADP_CERTIFICATE }}
          ADP_PRIVATE_KEY: ${{ secrets.ADP_PRIVATE_KEY }}
          ADP_CO_TEMPLATE: ${{ secrets.ADP_CO_TEMPLATE }}
          ADP_AZ_TEMPLATE: ${{ secrets.ADP_AZ_TEMPLATE }}
          ADP_TX_TEMPLATE: ${{ secrets.ADP_TX_TEMPLATE }}
          PAYROLL_FOLDER: ${{ runner.temp }}/payroll
          OUTPUT: ${{ runner.temp }}/adp-check
        run: |
          args=(--output "$OUTPUT")
          input=$(find "$PAYROLL_FOLDER" -name payroll-input.json 2>/dev/null | head -1)
          if [ -n "$input" ]; then args+=(--payroll-input "$input"); fi
          cd 'tips & payroll' && python adp_roster_check.py "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adp-roster-check-${{ github.run_id }}
          path: ${{ runner.temp }}/adp-check/
          retention-days: 3
          if-no-files-found: ignore
