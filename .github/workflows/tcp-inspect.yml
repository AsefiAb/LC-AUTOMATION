name: Inspect TCP payroll data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Pay-period start (YYYY-MM-DD); omit for catalog discovery only
        required: false
        type: string
      end_date:
        description: Pay-period end (YYYY-MM-DD); required when start is provided
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read TCP data
        env:
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          TCP_PAY_PERIOD_START: ${{ inputs.start_date }}
          TCP_PAY_PERIOD_END: ${{ inputs.end_date }}
        run: python 'tips & payroll/tcp_inspect.py'
      - name: Save private inspection report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tcp-inspection
          path: tips & payroll/reports/inspection.json
          retention-days: 3
          if-no-files-found: error
