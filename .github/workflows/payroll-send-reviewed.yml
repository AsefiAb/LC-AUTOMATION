name: Send reviewed regional payroll
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive start date YYYY-MM-DD of the reviewed package
        required: true
        type: string
      end_date:
        description: Inclusive end date YYYY-MM-DD
        required: true
        type: string
      asset_id:
        description: Encrypted private draft-release asset ID
        required: true
        type: string
      package_sha256:
        description: SHA256 of the approved encrypted package
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: biweekly-payroll
  cancel-in-progress: false
jobs:
  send:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt' PyNaCl==1.6.2
      - name: Restore approved private package
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PAYROLL_REVIEWED_PACKAGE_KEY: ${{ secrets.PAYROLL_REVIEWED_PACKAGE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python 'tips & payroll/reviewed_transfer.py'
          --asset-id "$ASSET_ID" --sha256 "$PACKAGE_SHA256"
          --folder "$RUNNER_TEMP/reviewed-payroll"
      - name: Verify source data, attachments, and send Alicia three regional emails
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          PAYROLL_ROLE_REVIEWS: ${{ secrets.PAYROLL_ROLE_REVIEWS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python 'tips & payroll/send_reviewed.py' --start "$START_DATE" --end "$END_DATE" --folder "$RUNNER_TEMP/reviewed-payroll" --send
          echo 'All three regional payroll messages were sent or already confirmed sent. Each includes its regional totals and store Excel attachments.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove decrypted temporary payroll
        if: always()
        run: |
          python -c "import os, pathlib, shutil; p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-payroll'; shutil.rmtree(p) if p.exists() else None"
