name: Payroll calculation checks
on:
  push:
    paths: ['tips & payroll/**', '.github/workflows/payroll-checks.yml']
  pull_request:
    paths: ['tips & payroll/**', '.github/workflows/payroll-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt'
      - run: python -m unittest discover -s 'tips & payroll' -p 'test_*.py' -v
