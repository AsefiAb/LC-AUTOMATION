name: Email Alicia missing TCP clock-outs
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive payroll start YYYY-MM-DD
        required: true
        type: string
      end_date:
        description: Inclusive payroll end YYYY-MM-DD
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: biweekly-payroll
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'tips & payroll/requirements.txt'
      - run: python -m unittest discover -s 'tips & payroll' -p 'test_clockout_notice.py' -q
      - name: Recheck TCP and email Alicia once
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python 'tips & payroll/clockout_notice.py' --start "$START_DATE" --end "$END_DATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clockout-notice-${{ github.run_id }}
          path: tips & payroll/reports/clockout-notice/
          retention-days: 3
          if-no-files-found: ignore
