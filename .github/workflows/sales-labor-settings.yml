name: Inspect Altametrics labor settings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'sales automation/requirements.txt'
      - run: python -m playwright install --with-deps chromium
      - name: Read store settings only
        env:
          ALTAMETRICS_AUTH_MODE: cloud-legacy
          COLORADO_USERNAME: ${{ secrets.COLORADO_USERNAME }}
          COLORADO_PASSWORD: ${{ secrets.COLORADO_PASSWORD }}
          AZ_USERNAME: ${{ secrets.AZ_USERNAME }}
          AZ_PASSWORD: ${{ secrets.AZ_PASSWORD }}
          TX_USERNAME: ${{ secrets.TX_USERNAME }}
          TX_PASSWORD: ${{ secrets.TX_PASSWORD }}
        run: python 'sales automation/inspect_labor_settings.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: altametrics-labor-settings
          path: sales automation/reports/
          retention-days: 3
