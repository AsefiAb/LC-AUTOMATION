name: Build dated DoorDash audit workbook
on:
  workflow_dispatch:
    inputs:
      period:
        description: Saved audit dates, YYYY-MM-DD_YYYY-MM-DD
        required: true
        type: string
      refresh_status:
        description: Refresh every order status directly from DoorDash in GitHub (no browser)
        type: boolean
        default: false
      verify_financials:
        description: Compare all stores and financial pages with the saved export directly in GitHub
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: npm ci --prefix doordash/scraper --no-audit --no-fund
      - name: Reconcile every saved audit transaction and status
        env:
          AUDIT_PERIOD: ${{ inputs.period }}
          GITHUB_TOKEN: ${{ github.token }}
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
          REFRESH_STATUS: ${{ inputs.refresh_status }}
        run: |
          args=(--cloud-period "$AUDIT_PERIOD" --output "$RUNNER_TEMP/audit/summary.json")
          if [ "$REFRESH_STATUS" = 'true' ]; then args+=(--refresh-status); fi
          python doordash/audit_summary.py "${args[@]}"
      - name: Verify complete current financial source against the export
        if: inputs.verify_financials == true
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
        run: python doordash/cloud_transactions.py --audit "$RUNNER_TEMP/audit/source-audit.json" --output "$RUNNER_TEMP/audit/financial-verification.json"
      - name: Build workbook without opening a browser or sending email
        run: node doordash/scraper/audit-report.mjs "$RUNNER_TEMP/audit/summary.json" "$RUNNER_TEMP/audit/DoorDash Audit.xlsx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: doordash-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/
          retention-days: 3
          if-no-files-found: error
