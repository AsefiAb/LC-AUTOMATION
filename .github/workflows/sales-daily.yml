name: Daily sales report
on:
  schedule:
    # Off-peak minutes: GitHub delays or drops top-of-the-hour schedules. The
    # Python gate (schedule_gate.py, run_time in config.json) allows a run from
    # 07:45 America/Los_Angeles in both PDT and PST; earlier slots exit before
    # installing anything, and later slots are retries that stop at the receipt.
    - cron: '47 14 * * *'
    - cron: '7,27,52 15 * * *'
    - cron: '22,52 16 * * *'
    - cron: '7 17,18,20,22 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Completed report date (YYYY-MM-DD); blank means yesterday Pacific
        required: false
        type: string
      mode:
        description: Check, preview, deliver, or repair dated workbook inputs without email (repair-gaps fills blank cells only)
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - preview
          - deliver
          - repair-preview
          - repair
          - repair-gaps-preview
          - repair-gaps
      end_date:
        description: Repair end date inclusive (report_date is start); ignored for other modes
        required: false
        type: string
      source_sha256:
        description: Optional exact digest of the owner-reviewed capture in SALES_REPAIR_SOURCE_JSON (repair, or manual preview/deliver when Altametrics blocks the login)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: daily-tcp-sales
  cancel-in-progress: false
jobs:
  report:
    # GitHub-hosted collection. Switch to the owner's Windows runner by setting
    # repository variable SALES_RUNNER=local (see README: Local runner fallback).
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && vars.SALES_RUNNER != 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check local run time and delivery receipt
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            gate=true
          else
            gate=$(python 'sales automation/schedule_gate.py')
          fi
          case "$gate" in true|false) ;; *) echo "schedule_gate.py printed '$gate'" >&2; exit 1 ;; esac
          echo "run=$gate" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r 'sales automation/requirements.txt'
      - if: steps.gate.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Verify reporting safeguards
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s 'sales automation' -p 'test_*.py' -v
      - name: Validate sources, update workbooks, and deliver
        if: steps.gate.outputs.run == 'true'
        env:
          ALTAMETRICS_AUTH_MODE: cloud-legacy
          COLORADO_USERNAME: ${{ secrets.COLORADO_USERNAME }}
          COLORADO_PASSWORD: ${{ secrets.COLORADO_PASSWORD }}
          AZ_USERNAME: ${{ secrets.AZ_USERNAME }}
          AZ_PASSWORD: ${{ secrets.AZ_PASSWORD }}
          TX_USERNAME: ${{ secrets.TX_USERNAME }}
          TX_PASSWORD: ${{ secrets.TX_PASSWORD }}
          CO_GATEWAY_USER: ${{ secrets.CO_GATEWAY_USER }}
          CO_GATEWAY_PASS: ${{ secrets.CO_GATEWAY_PASS }}
          AZ_GATEWAY_USER: ${{ secrets.AZ_GATEWAY_USER }}
          AZ_GATEWAY_PASS: ${{ secrets.AZ_GATEWAY_PASS }}
          TX_GATEWAY_USER: ${{ secrets.TX_GATEWAY_USER }}
          TX_GATEWAY_PASS: ${{ secrets.TX_GATEWAY_PASS }}
          REPORT_DATE: ${{ inputs.report_date }}
          END_DATE: ${{ inputs.end_date }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SALES_REPAIR_SOURCE_JSON: ${{ secrets.SALES_REPAIR_SOURCE_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode || (vars.SALES_AUTOMATION_ENABLED == 'true' && 'deliver' || 'preflight') }}
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || 'common' }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          case "$MODE" in
            repair*) ;;
            preview|deliver)
              if [ -n "$SOURCE_SHA256" ] && [ "$EVENT_NAME" != workflow_dispatch ]; then echo 'Reviewed source is for manual runs only.'; exit 1; fi ;;
            *) if [ -n "$SOURCE_SHA256" ]; then echo 'Reviewed source is supported only in repair, preview and deliver modes.'; exit 1; fi ;;
          esac
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          case "$MODE" in
            preflight) args+=(--preflight) ;;
            preview) args+=(--preview) ;;
            deliver)
              if [ "$EVENT_NAME" = schedule ]; then args+=(--catch-up-days 7); fi
              ;;
            repair|repair-preview|repair-gaps|repair-gaps-preview)
              if [ -z "$REPORT_DATE" ]; then echo 'Repair requires an explicit report_date start.'; exit 1; fi
              repair_args=(--start "$REPORT_DATE" --end "${END_DATE:-$REPORT_DATE}")
              case "$MODE" in *-preview) repair_args+=(--preview) ;; esac
              case "$MODE" in repair-gaps*) repair_args+=(--gaps-only) ;; esac
              if [ -n "$SOURCE_SHA256" ]; then
                python - <<'PY'
          import os
          from pathlib import Path
          content = os.environ.get('SALES_REPAIR_SOURCE_JSON', '')
          if not content:
              raise SystemExit('Missing encrypted reviewed source secret.')
          (Path(os.environ['RUNNER_TEMP']) / 'sales-reviewed-source.json').write_bytes(content.encode('utf-8'))
          PY
                repair_args+=(--source-records "$RUNNER_TEMP/sales-reviewed-source.json" --source-sha256 "$SOURCE_SHA256")
              fi
              python 'sales automation/repair_workbooks.py' "${repair_args[@]}"
              exit $?
              ;;
            *) exit 1 ;;
          esac
          if [ -n "$SOURCE_SHA256" ]; then
            python - <<'PY'
          import os
          from pathlib import Path
          content = os.environ.get('SALES_REPAIR_SOURCE_JSON', '')
          if not content:
              raise SystemExit('Missing encrypted reviewed source secret.')
          (Path(os.environ['RUNNER_TEMP']) / 'sales-reviewed-source.json').write_bytes(content.encode('utf-8'))
          PY
            args+=(--source-records "$RUNNER_TEMP/sales-reviewed-source.json" --source-sha256 "$SOURCE_SHA256")
          fi
          python 'sales automation/daily_report.py' "${args[@]}"
      - name: Notify owner if scheduled reporting is incomplete
        if: failure() && github.event_name == 'schedule' && vars.SALES_AUTOMATION_ENABLED == 'true'
        env:
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # A failure before the gated install must still produce the owner notice.
          python -m pip install --quiet -r 'sales automation/requirements.txt'
          python 'sales automation/notify_failure.py'
      - name: Keep private reports briefly
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-sales-${{ github.run_id }}
          path: sales automation/reports/
          retention-days: 14
          if-no-files-found: ignore

  report-local:
    # Opt-in fallback when Altametrics challenges GitHub-hosted logins. Requires
    # the owner's Windows runner (label lc-sales-interactive) with the three
    # dedicated signed-in sales browsers open: live_browser.py --open-all.
    # Reads existing dashboards only; no credentials or sessions are stored.
    if: github.event.repository.private == true && github.ref == 'refs/heads/main' && vars.SALES_RUNNER == 'local'
    runs-on: [self-hosted, Windows, X64, lc-sales-interactive]
    timeout-minutes: 45
    defaults:
      run:
        # Built-in Windows PowerShell 5.1; PowerShell 7 is not required on the runner.
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated local Python
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12), 'Python 3.12 is required'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $salesVenv = Join-Path $env:RUNNER_TEMP 'sales-venv'
          python -m venv $salesVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $salesVenv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check local run time and delivery receipt
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Windows Python needs the tzdata package for IANA zones; nothing else before the gate.
          python -m pip install --quiet tzdata==2025.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $gate = 'true'
          } else {
            $gate = (python 'sales automation/schedule_gate.py' | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($gate -ne 'true' -and $gate -ne 'false') { Write-Error "schedule_gate.py printed '$gate'"; exit 1 }
          "run=$gate" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r 'sales automation/requirements.txt'
      - if: steps.gate.outputs.run == 'true'
        run: python -m playwright install chromium
      - name: Verify reporting safeguards
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s 'sales automation' -p 'test_*.py' -v
      - name: Validate sources, update workbooks, and deliver
        if: steps.gate.outputs.run == 'true'
        env:
          ALTAMETRICS_AUTH_MODE: local-live
          REPORT_DATE: ${{ inputs.report_date }}
          END_DATE: ${{ inputs.end_date }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SALES_REPAIR_SOURCE_JSON: ${{ secrets.SALES_REPAIR_SOURCE_JSON }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode || (vars.SALES_AUTOMATION_ENABLED == 'true' && 'deliver' || 'preflight') }}
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || 'common' }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $reportArgs = @()
          if ($env:SOURCE_SHA256 -and $env:MODE -notlike 'repair*') {
            Write-Error 'Reviewed source is supported only in repair modes.'; exit 1
          }
          if ($env:REPORT_DATE) { $reportArgs += @('--date', $env:REPORT_DATE) }
          switch -Wildcard ($env:MODE) {
            'preflight' { $reportArgs += '--preflight' }
            'preview' { $reportArgs += '--preview' }
            'deliver' { if ($env:EVENT_NAME -eq 'schedule') { $reportArgs += @('--catch-up-days', '7') } }
            'repair*' {
              if (-not $env:REPORT_DATE) { Write-Error 'Repair requires an explicit report_date start.'; exit 1 }
              $end = if ($env:END_DATE) { $env:END_DATE } else { $env:REPORT_DATE }
              $repairArgs = @('--start', $env:REPORT_DATE, '--end', $end)
              if ($env:MODE -like '*-preview') { $repairArgs += '--preview' }
              if ($env:MODE -like 'repair-gaps*') { $repairArgs += '--gaps-only' }
              if ($env:SOURCE_SHA256) {
                if (-not $env:SALES_REPAIR_SOURCE_JSON) { Write-Error 'Missing encrypted reviewed source secret.'; exit 1 }
                # Exact bytes, no BOM or trailing newline, so the digest check matches the secret.
                $sourcePath = Join-Path $env:RUNNER_TEMP 'sales-reviewed-source.json'
                [System.IO.File]::WriteAllBytes($sourcePath, [System.Text.Encoding]::UTF8.GetBytes($env:SALES_REPAIR_SOURCE_JSON))
                $repairArgs += @('--source-records', $sourcePath, '--source-sha256', $env:SOURCE_SHA256)
              }
              python 'sales automation/repair_workbooks.py' @repairArgs
              exit $LASTEXITCODE
            }
            default { exit 1 }
          }
          python 'sales automation/daily_report.py' @reportArgs
          exit $LASTEXITCODE
      - name: Notify owner if scheduled reporting is incomplete
        if: failure() && github.event_name == 'schedule' && vars.SALES_AUTOMATION_ENABLED == 'true'
        env:
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # A failure before the gated install must still produce the owner notice.
          python -m pip install --quiet -r 'sales automation/requirements.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python 'sales automation/notify_failure.py'
          exit $LASTEXITCODE
      - name: Keep private reports briefly
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-sales-${{ github.run_id }}
          path: sales automation/reports/
          retention-days: 14
          if-no-files-found: ignore
