name: Daily sales report
on:
  schedule:
    # One local 08:00 run, with the Python gate accounting for Pacific DST.
    - cron: '0 15,16,18 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Completed report date (YYYY-MM-DD); blank means yesterday Pacific
        required: false
        type: string
      mode:
        description: Preflight, private preview, or live workbook update and delivery
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - preview
          - deliver
permissions:
  contents: write
concurrency:
  group: daily-tcp-sales
  cancel-in-progress: false
jobs:
  report:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, lc-sales-interactive]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r 'sales automation/requirements.txt'
      - run: python -m playwright install chromium
      - name: Verify reporting safeguards
        run: python -m unittest discover -s 'sales automation' -p 'test_*.py' -v
      - name: Check local run time
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            'run=true' >> $env:GITHUB_OUTPUT
          } else {
            $gate = python 'sales automation/daily_report.py' --schedule-gate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "run=$gate" >> $env:GITHUB_OUTPUT
          }
      - name: Validate sources, update workbooks, and deliver
        if: steps.gate.outputs.run == 'true'
        env:
          ALTAMETRICS_AUTH_MODE: local-session
          CO_ALTAMETRICS_SESSION: ${{ secrets.CO_ALTAMETRICS_SESSION }}
          AZ_ALTAMETRICS_SESSION: ${{ secrets.AZ_ALTAMETRICS_SESSION }}
          TX_ALTAMETRICS_SESSION: ${{ secrets.TX_ALTAMETRICS_SESSION }}
          REPORT_DATE: ${{ inputs.report_date }}
          MODE: ${{ inputs.mode || (vars.SALES_AUTOMATION_ENABLED == 'true' && 'deliver' || 'preflight') }}
          TCP_CLIENT_ID: ${{ secrets.TCP_CLIENT_ID }}
          TCP_CLIENT_SECRET: ${{ secrets.TCP_CLIENT_SECRET }}
          TCP_API_KEY: ${{ secrets.TCP_API_KEY }}
          TCP_COMPANY_ID: ${{ vars.TCP_COMPANY_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          MS_TENANT_ID: ${{ vars.MS_TENANT_ID || 'common' }}
          CAAZ_GMAIL_APP_PASS: ${{ secrets.CAAZ_GMAIL_APP_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ($env:MODE -eq 'preflight') {
            'Sales validation only. No workbook uploads or email.' >> $env:GITHUB_STEP_SUMMARY
          }
          $reportArgs = @()
          if ($env:REPORT_DATE) { $reportArgs += @('--date', $env:REPORT_DATE) }
          switch ($env:MODE) {
            'preflight' { $reportArgs += '--preflight' }
            'preview' { $reportArgs += '--preview' }
            'deliver' { }
            default { exit 1 }
          }
          python 'sales automation/daily_report.py' @reportArgs
          exit $LASTEXITCODE
      - name: Keep private reports briefly
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daily-sales-${{ github.run_id }}
          path: sales automation/reports/
          retention-days: 3
          if-no-files-found: ignore
