name: DoorDash checks
on:
  push:
    paths: ['doordash/**', '.github/workflows/doordash-checks.yml']
  pull_request:
    paths: ['doordash/**', '.github/workflows/doordash-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        working-directory: doordash
      - run: npm run build && node --test tests/dashboard.test.cjs
        working-directory: doordash
      - run: npm ci --no-audit --no-fund
        working-directory: doordash/scraper
      - run: npx playwright install --with-deps chromium
        working-directory: doordash/scraper
      - run: npm test
        working-directory: doordash/scraper
      - run: python -m pip install requests==2.32.5 tzdata==2025.3
      - run: python -m unittest discover -s doordash -p 'test_*.py' -v
