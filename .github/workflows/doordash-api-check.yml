name: Read-only DoorDash cloud status check
on:
  workflow_dispatch:
    inputs:
      delivery_id:
        description: Known historical delivery UUID for this read-only check
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Read one known historical dispute without launching a browser
        env:
          DOORDASH_STORAGE_STATE: ${{ secrets.DOORDASH_STORAGE_STATE }}
          DOORDASH_CHECK_DELIVERY_ID: ${{ inputs.delivery_id }}
        run: python doordash/cloud_status_check.py
